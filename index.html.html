
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap');
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --primary: #1a5276;
    --primary-light: #2e86c1;
    --accent: #117a65;
    --accent-light: #1abc9c;
    --gold: #b7950b;
    --gold-light: #f1c40f;
    --danger: #922b21;
    --danger-light: #e74c3c;
    --surface: #f8f9fa;
    --border: rgba(0,0,0,0.1);
    --text: #1a1a2e;
    --text-muted: #5d6d7e;
  }

  body { font-family: 'Tajawal', 'IBM Plex Sans Arabic', sans-serif; direction: rtl; }

  .exam-shell {
    background: var(--surface);
    min-height: 600px;
    padding: 0;
  }

  .exam-header {
    background: linear-gradient(135deg, #1a3a5c 0%, #1a5276 50%, #117a65 100%);
    padding: 1.5rem 1.5rem 1rem;
    color: white;
    border-radius: var(--border-radius-lg) var(--border-radius-lg) 0 0;
  }

  .exam-header h1 {
    font-size: 22px;
    font-weight: 700;
    color: white;
    margin-bottom: 4px;
  }

  .exam-header p {
    font-size: 13px;
    opacity: 0.8;
    color: white;
  }

  .stats-bar {
    display: flex;
    gap: 12px;
    margin-top: 1rem;
    flex-wrap: wrap;
  }

  .stat-pill {
    background: rgba(255,255,255,0.15);
    border: 0.5px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 13px;
    color: white;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .stat-pill i { font-size: 14px; }

  .filter-bar {
    background: white;
    border-bottom: 0.5px solid var(--border);
    padding: 0.75rem 1.5rem;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-btn {
    background: white;
    border: 0.5px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    color: var(--text-muted);
    transition: all 0.15s;
  }

  .filter-btn.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  .filter-btn:hover:not(.active) {
    background: #eef2f7;
    border-color: #aab;
  }

  .mode-toggle {
    margin-right: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .toggle-switch {
    width: 36px;
    height: 20px;
    background: #ccc;
    border-radius: 10px;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
    border: none;
    flex-shrink: 0;
  }

  .toggle-switch.on { background: var(--accent); }

  .toggle-switch::after {
    content: '';
    width: 16px;
    height: 16px;
    background: white;
    border-radius: 50%;
    position: absolute;
    top: 2px;
    left: 2px;
    transition: left 0.2s;
  }

  .toggle-switch.on::after { left: 18px; }

  .questions-area {
    padding: 1rem 1.5rem 2rem;
  }

  .section-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--primary);
    margin: 1rem 0 0.75rem;
    padding-right: 8px;
    border-right: 3px solid var(--primary);
  }

  .question-card {
    background: white;
    border: 0.5px solid var(--border);
    border-radius: var(--border-radius-lg);
    margin-bottom: 1rem;
    overflow: hidden;
    transition: box-shadow 0.15s;
  }

  .question-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 1rem 1rem 0.75rem;
    cursor: pointer;
  }

  .q-num {
    background: var(--primary);
    color: white;
    font-size: 12px;
    font-weight: 500;
    border-radius: 6px;
    padding: 3px 8px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .q-text {
    font-size: 15px;
    line-height: 1.7;
    color: var(--text);
    flex: 1;
  }

  .q-expand-btn {
    color: var(--text-muted);
    font-size: 16px;
    flex-shrink: 0;
    transition: transform 0.2s;
  }

  .question-card.expanded .q-expand-btn { transform: rotate(180deg); }

  .options-area {
    padding: 0 1rem 0;
    display: none;
  }

  .question-card.expanded .options-area { display: block; }

  .option-btn {
    width: 100%;
    text-align: right;
    background: #f8f9fa;
    border: 0.5px solid #ddd;
    border-radius: 8px;
    padding: 0.6rem 0.9rem;
    margin-bottom: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.15s;
    direction: rtl;
  }

  .option-btn:hover:not(:disabled) {
    background: #eef5ff;
    border-color: var(--primary-light);
  }

  .option-letter {
    background: white;
    border: 0.5px solid #ccc;
    border-radius: 50%;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 500;
    flex-shrink: 0;
    color: var(--text-muted);
  }

  .option-btn.correct {
    background: #eafaf1;
    border-color: #27ae60;
    color: #1a6b3a;
  }

  .option-btn.correct .option-letter {
    background: #27ae60;
    border-color: #27ae60;
    color: white;
  }

  .option-btn.wrong {
    background: #fdedec;
    border-color: #e74c3c;
    color: #922b21;
  }

  .option-btn.wrong .option-letter {
    background: #e74c3c;
    border-color: #e74c3c;
    color: white;
  }

  .option-btn.show-correct {
    background: #eafaf1;
    border-color: #27ae60;
    color: #1a6b3a;
  }

  .option-btn.show-correct .option-letter {
    background: #27ae60;
    border-color: #27ae60;
    color: white;
  }

  .option-btn:disabled { cursor: default; }

  .explanation-box {
    margin: 0.5rem 0 1rem;
    background: linear-gradient(135deg, #eef8ff 0%, #f0fff8 100%);
    border: 0.5px solid #a9d4f5;
    border-radius: 8px;
    padding: 0.75rem 1rem;
    font-size: 13px;
    line-height: 1.8;
    color: #1a3a5c;
    display: none;
  }

  .explanation-box.visible { display: block; }

  .explanation-box strong {
    color: var(--primary);
    display: block;
    margin-bottom: 4px;
    font-size: 13px;
  }

  .q-source {
    font-size: 11px;
    color: var(--text-muted);
    padding: 0 1rem 0.75rem;
    text-align: left;
    display: none;
  }

  .question-card.expanded .q-source { display: block; }

  .progress-bar-wrap {
    height: 4px;
    background: #e0e0e0;
    margin: 0;
  }

  .progress-bar-fill {
    height: 4px;
    background: linear-gradient(90deg, var(--accent), var(--primary));
    transition: width 0.4s ease;
  }

  .bottom-bar {
    background: white;
    border-top: 0.5px solid var(--border);
    padding: 0.75rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .score-display {
    font-size: 14px;
    color: var(--text);
    margin-left: auto;
  }

  .score-num {
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
  }

  .reset-btn {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 7px 16px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .reset-btn:hover { background: var(--primary-light); }

  .result-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    flex-shrink: 0;
  }

  .badge-correct { background: #d5f5e3; color: #1a6b3a; }
  .badge-wrong { background: #fadbd8; color: #922b21; }
  .badge-unanswered { background: #fef9e7; color: #7d6608; }

  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-muted);
  }

  .exam-img {
    max-width: 280px;
    border-radius: 8px;
    border: 0.5px solid var(--border);
    margin: 8px 0;
    display: block;
  }
</style>

<script>
const QUESTIONS = [
  {id:1,year:'2024-2025',text:'يمثل الشكل رقم 1 تشكل القرص الجنيني ثلاثي الصفيحة الخلوية في اليوم — E يمثل:',options:['في بطانة المبيض','في جدار الرحم','في بطانة الرحم','في البوق الرحمي'],answer:1,explain:'E في الشكل يشير إلى طبقتين متراصتين (الأرومة العلوية والسفلية) وهما موجودتان في بطانة الرحم (طبقة القرار). الجنين في مرحلة القرص ثنائي ثم ثلاثي الصفيحة يكون مندمجاً في بطانة الرحم.'},
  {id:2,year:'2024-2025',text:'الهيبالورونيداز هو:',options:['أنزيم حل للمواد الملاملية بين خلايا الأكيل المشع','أنزيم حل للغشاء الشفيف','يدخل في تركيب الغشاء الشفيف','أنزيم حل للغشاء السيتوبلاسمي'],answer:0,explain:'الهيبالورونيداز (Hyaluronidase) هو أنزيم موجود في الجسيم الطرفي للنطفة. يعمل على حل المادة الأساسية (حمض الهيالورونيك) الموجودة بين خلايا الكورونا راديتا (الأكيل المشع) المحيطة بالبويضة، مما يسمح للنطفة بالاختراق.'},
  {id:3,year:'2024-2025',text:'تبقى النطفة على قيد الحياة في:',options:['البوقين 48 ساعة','عنق الرحم 24 ساعة','البوقين 24 ساعة','المهبل 16 ساعة'],answer:1,explain:'بقاء النطفة على قيد الحياة: في المهبل 6 ساعات، في عنق الرحم 24 ساعة، في البوقين 48-72 ساعة. الإجابة الصحيحة هي عنق الرحم 24 ساعة. ملاحظة: بعض المراجع قد تختلف قليلاً في هذه الأرقام.'},
  {id:4,year:'2024-2025',text:'يبعث الخلية البيضية على إتمام الانقسام المنصف الأول ودخولها بالثاني:',options:['الاستروجين','LH','FSH','البروجيسترون'],answer:1,explain:'هرمون LH (الهرمون المصفر / الموجه للخاليا الثخينية) هو المسؤول عن حث البويضة على استئناف الانقسام المنصف الأول الذي كان متوقفاً في الطور التمهيدي الأول. تحدث دفقة LH قبيل الإباضة مباشرة.'},
  {id:5,year:'2024-2025',text:'هرمون FSH يعمل على:',options:['إتمام الانقسام المنصف الثاني','تنشيط إفراز الاستروجين من الخلايا الجريبية','حث الإباضة','تنشيط إفراز البروجيسترون'],answer:1,explain:'FSH (الهرمون المنبه للجريب) يعمل على: تنمية الجريبات، وتنشيط إفراز الاستروجين من الخلايا الجريبية (خلايا الجرانولوزا). أما LH فهو الذي يحث الإباضة ويحفز إفراز البروجيسترون.'},
  {id:6,year:'2024-2025',text:'التفاعل الساقطي هو تحولات تالية ببطانة الرحم باستثناء:',options:['خلايا كبيرة متعددة السطوح','تمتلئ الخلايا بالغليكوجين والشحوم','النسيج متوذم','خلايا صغيرة كروية'],answer:3,explain:'التفاعل الساقطي (Decidual Reaction) هو تحول خلايا النسيج الضام لبطانة الرحم إلى خلايا ساقطية كبيرة مضلعة الشكل (متعددة السطوح)، تمتلئ بالغليكوجين والشحوم، ويصبح النسيج متوذماً. الخلايا الصغيرة الكروية ليست من صفات التفاعل الساقطي.'},
  {id:7,year:'2024-2025',text:'في اليوم الثامن من التنامي الجنيني يتشكل:',options:['كيس محي أولي','طور زغابي','الأرومة المغذية ذات التكثر الخلوي','أدمة وسطى'],answer:0,explain:'في اليوم الثامن: يتميز الجنين إلى قرص ثنائي الصفيحة، تنقسم الأرومة السفلية لتشكل غشاء هوزر ثم الكيس المحي الأولي. أما الأرومة المغذية ذات التكثر الخلوي فتتشكل قبل ذلك (اليوم 6-7).'},
  {id:8,year:'2024-2025',text:'المشيمة المتزاحة:',options:['انغراس شاذ في المبيض','انغراس طبيعي في القسم الخلفي لقاع الرحم','انغراس شاذ في جوار النهوة الباطنة لعنق الرحم','انغراس شاذ في قناة فالوب'],answer:2,explain:'المشيمة المتزاحة (Placenta Previa) هي انغراس شاذ للمشيمة في القطب السفلي للرحم، بجوار أو على الفوهة الباطنة لعنق الرحم. هي حالة خطرة تسبب نزيفاً في الحمل.'},
  {id:9,year:'2024-2025',text:'يتصف الحبل الظهري بما يلي باستثناء:',options:['محرض على تشكل التلب','يكون نواة لبية','بنية مؤقتة','يستطيل ليبلغ حدود الصفيحة أمام الحبل'],answer:3,explain:'الحبل الظهري (الحبل السري) هو: محرض على تشكل التلب (الصفيحة العصبية)، يكون النواة اللبية للأقراص الفقارية، وهو بنية مؤقتة. لكنه لا يستطيل ليبلغ حدود الصفيحة أمام الحبلية - بل الصفيحة أمام الحبلية هي التي تشكل حد النمو للخط الابتدائي.'},
  {id:10,year:'2024-2025',text:'طبقة ......هي مصدر جميع الأدمات:',options:['الأرومة السفلية','الأرومة العلوية','الأرومة المغذية','الأرومة المغذية ذات التكثر الخلوي'],answer:1,explain:'الأرومة العلوية (Epiblast) هي مصدر جميع الأدمات الثلاث (الخارجية والوسطى والداخلية) وهي تشكل قرص ثلاثي الصفيحة عبر الخط الابتدائي. خلايا الأرومة العلوية تهاجر نحو الخط الابتدائي لتشكل الأدمة الوسطى والداخلية.'},
  {id:11,year:'2024-2025',text:'الجسم الأصفر الحملي يصل بحجمه في نهاية الشهر الثالث إلى:',options:['خمس حجم المبيض','ربع حجم المبيض','نصف حجم المبيض','ثلث حجم المبيض'],answer:2,explain:'الجسم الأصفر الحملي يكبر تحت تأثير HCG ليصل في نهاية الشهر الثالث إلى نصف حجم المبيض. ثم يبدأ بالتقلص بعد أن تتولى المشيمة إفراز البروجيسترون.'},
  {id:12,year:'2024-2025',text:'يحدد ......... المحور الأمامي الخلفي للقرص الجنيني:',options:['الصفيحة الجذبية','الخط الابتدائي','القطع الكلوية','القطع الظهرية'],answer:1,explain:'الخط الابتدائي (Primitive Streak) يحدد: المحور الأمامي الخلفي للجنين (الرأس عند الطرف الأمامي والذيل عند الطرف الخلفي). كذلك يحدد اليمين واليسار والظهر والبطن.'},
  {id:13,year:'2024-2025',text:'وظائف خلايا سيرتولي ما يلي باستثناء:',options:['بلعمة','حماية','إنتاج التستسترون','تثبيت النطاف في أماكنها'],answer:2,explain:'خلايا سيرتولي تقوم بـ: بلعمة الخلايا التالفة، حماية النطاف (الحاجز الدموي المنوي)، تغذية النطاف، تثبيت النطاف. لكنها لا تنتج التستسترون — هذه وظيفة خلايا ليدغ (Leydig cells).'},
  {id:14,year:'2024-2025',text:'يقع في منطقة اتصال الأنبورة بالقناة الدافقة:',options:['الحويصل المنوي','القناة الدافقة','الأحليل','البروستاتة'],answer:3,explain:'منطقة اتصال الأنبورة (الأسهر) بالحويصل المنوي تشكل القناة الدافقة (القناة القذافية). وهذه القناة تفتح في الحليل الإحليلي للبروستاتة، لذا البروستاتة هي التي تقع في هذه المنطقة.'},
  {id:15,year:'2024-2025',text:'عند دخول النطفة للخلية البيضية يحصل ما يلي باستثناء:',options:['التفاعل التشري','استئناف الانقسام المنصف الثاني','تقاطع الجسيم الطرفي','الاندماج النووي'],answer:0,explain:'عند دخول النطفة للبويضة يحصل: استئناف الانقسام المنصف الثاني، تقاطع الجسيم الطرفي، الاندماج النووي. أما التفاعل التشري (Acrosomal reaction) فيحصل قبل الدخول — عند اختراق البويضة.'},
  {id:16,year:'2024-2025',text:'تتصف الأرومة المغذية بما يلي باستثناء:',options:['شديدة التماسك','كبيرة الحجم','مسطحة','محيطية'],answer:2,explain:'الأرومة المغذية (Trophoblast) تتصف بـ: شدة التماسك واللصوقية، الحجم الكبير، كونها محيطية (تحيط بالجنين). أما المسطحة فهي صفة الأرومة الجنينية (Embryoblast).'},
  {id:17,year:'2024-2025',text:'التفاعل الساقطي هو تحولات تالية ببطانة الرحم باستثناء:',options:['خلايا كبيرة متعددة السطوح','تمتلئ الخلايا بالغليكوجين والشحوم','النسيج متوذم','خلايا صغيرة كروية'],answer:3,explain:'التفاعل الساقطي (Decidualization): الخلايا تصبح كبيرة مضلعة، تمتلئ بالغليكوجين والدهون، النسيج يصبح متوذماً. الخلايا الصغيرة الكروية ليست من خصائصه.'},
  {id:18,year:'2024-2025',text:'بعد تشكل القطع الظهرية تختفي فيما بعد:',options:['القطع العجزية الخمس','القطع الرقبية','القطعة القذالية الأولى','القطع العصعصية الثانية إلى المشرة'],answer:3,explain:'بعد تشكل القطع الظهرية، تختفي القطع العصعصية (من الثانية إلى المشرة) خلال التطور الجنيني. يبقى حوالي 42-44 قطعة ظهرية من أصل 42-44 زوجاً.'},
  {id:19,year:'2024-2025',text:'إذا كان عدد القطع الظهرية لدى الجنين 17-20، يكون عمره التقريبي بالأيام:',options:['23','22','24','25'],answer:0,explain:'العلاقة بين عدد القطع الظهرية والعمر الجنيني: 1-4 قطع = يوم 20، 4-7 = يوم 21، 7-10 = يوم 22، 10-13 = يوم 23. عند 17-20 قطعة يكون العمر التقريبي 23 يوماً.'},
  {id:20,year:'2024-2025',text:'إذا كان العمر التقريبي للجنين 30 يوماً، يكون عدد القطع الظهرية:',options:['26-23','20-17','29-26','35-34'],answer:3,explain:'في الجنين 30 يوماً العمر التقريبي، يكون عدد القطع الظهرية 34-35. هذه العلاقة تعتمد على جداول سومرستاين لتحديد العمر الجنيني من عدد القطع.'},
  {id:21,year:'2024-2025',text:'من مشتقات الأدمة الوسطى ما يلي باستثناء:',options:['الطحال','المبيضين','الكليتين','لب غدة الكظر'],answer:3,explain:'مشتقات الأدمة الوسطى تشمل: الطحال، المبيضين، الكليتين، القلب، الجهاز الدوري، قشرة الكظر، والجهاز التناسلي. أما لب الغدة الكظرية فهو من مشتقات العرف العصبي (الأدمة الخارجية).'},
  {id:22,year:'2024-2025',text:'من مشتقات الأدمة الداخلية:',options:['بطانة الأحليل','مصليات غشاء التامور','الطحال','الغدة النخامية'],answer:0,explain:'الأدمة الداخلية (الأديم الباطن/Endoderm) تشكل: بطانة الجهاز الهضمي، الجهاز التنفسي، الكبد، البنكرياس، الغدة الدرقية، وبطانة الأحليل. الطحال ومصليات التامور من الأدمة الوسطى.'},
  {id:23,year:'2024-2025',text:'يلتقي الانثناءان العصبيان في المنطقة:',options:['الرقبية عند التقطعة الظهرية الرابعة','الصدرية عند التقطعة الظهرية الخامسة','الرقبية عند التقطعة الظهرية الخامسة','الرقبية عند التقطعة الظهرية الثالثة'],answer:0,explain:'يبدأ اندماج الطيتين العصبيتين (الانثناءان العصبيان) في منطقة عنق الرحم (الرقبة) عند مستوى القطعة الظهرية الرابعة، ثم يتقدم الاندماج في الاتجاهين الأمامي والخلفي.'},
  {id:24,year:'2024-2025',text:'تتكون الجملة العصبية:',options:['من الأدمة الخارجية','من الأدمة الوسطى','بتحريض من الحبل الظهري','منذ الأسبوع الخامس عشر'],answer:2,explain:'الجملة العصبية (الجهاز العصبي) تنشأ من الأدمة الخارجية (الأديم الظاهر)، لكنها تتشكل بتحريض من الحبل الظهري (محرض رئيسي). تبدأ تشكل الصفيحة العصبية في الأسبوع الثالث.'},
  {id:25,year:'2024-2025',text:'في فيما يتعلق بالفتق السري الفيزيولوجي:',options:['عرى معوية في بداية الحبل السري','عرى معدية في الوثيقة','نمو الجوف البطني كبير جداً في الشهر الأول','تدخل العرى المعوية في الشهر الأول'],answer:0,explain:'الفتق السري الفيزيولوجي: بسبب النمو السريع للأمعاء وصغر الجوف البطني النسبي، تبرز عرى من الأمعاء الدقيقة إلى قاعدة الحبل السري في الأسبوع 6-10. تعود الأمعاء للجوف البطني بنهاية الأسبوع العاشر.'},
  {id:26,year:'2024-2025',text:'في اليوم الثامن من التنامي الجنيني يتشكل:',options:['كيس محي أولي','طور زغابي','الأرومة المغذية ذات التكثر الخلوي','أدمة وسطى'],answer:0,explain:'اليوم 8: تتميز الأرومة السفلية لتشكل غشاء هوزر، والكيس المحي الأولي، يبدأ تشكل الجوف السلوي.'},
  {id:27,year:'2024-2025',text:'يدخل في تركيب السائل السلوي من مصدر جنيني باستثناء:',options:['بروستاغلاندين','غليسيريدات','الكولسترول','الفا فوتو بروتين'],answer:0,explain:'مكونات السائل السلوي من المصدر الجنيني: الفا فوتو بروتين، الكولسترول، الغليسيريدات، الهرمونات. أما البروستاغلاندين فهو مصدره أمومي بالدرجة الأولى.'},
  {id:28,year:'2024-2025',text:'فيما يتعلق بالتوائم، إذا حدث الانفصال الخلوي قبل اليوم الثامن، للجنينين:',options:['جوفان سلويان ومشيمتان منفصلتان','جوفان سلويان وجوف مشيمائي واحد','جوف سلوي واحد وجوف مشيمائي واحد','جوف سلوي واحد وجوفان مشيمائيان'],answer:0,explain:'التوائم وفق توقيت الانفصال: قبل اليوم 4 → مشيمتان وجوفان سلويان (ثنائية المشيمة ثنائية السلى). اليوم 4-8 → مشيمة واحدة وجوفان سلويان. اليوم 8-13 → مشيمة وجوف سلوي واحدان. بعد اليوم 13 → توائم ملتصقة.'},
  {id:29,year:'2024-2025',text:'تؤدي الأسباب التالية إلى قلة السلى باستثناء:',options:['انسداد حالبي','مرض السكري للأم','فقدان الكلية','قصور المشيمة'],answer:1,explain:'أسباب قلة السلى (Oligohydramnios): فقدان الكلية أو تطورها الشاذ، انسداد حالبي، قصور المشيمة. أما مرض السكري فهو يسبب كثرة السلى (Polyhydramnios) وليس قلته.'},
  {id:30,year:'2024-2025',text:'يتم الانتقال بالانتشار البسيط:',options:['فيتامين ك','الفا غلوبولين','الحموض الأمينية','البروتينات ذات الحجم الكبير'],answer:0,explain:'الانتشار البسيط عبر المشيمة: الغازات (O2, CO2)، الماء، الكحول، بعض الأدوية، ومواد قابلة للذوبان بالدهون كفيتامين ك. الحموض الأمينية تنتقل بالنقل الفعال، والبروتينات بالبلعمة.'},
  {id:31,year:'2024-2025',text:'تزن المشيمة في تمام الحمل:',options:['50-60 غ','300 غ','250-350 غ','500-600 غ'],answer:3,explain:'وزن المشيمة في تمام الحمل: 500-600 غرام، بشكل قرص سمكه 2-3 سم وقطره 15-20 سم.'},
  {id:32,year:'2024-2025',text:'يمثل الشكل رقم 2 — A يمثل:',options:['8','18','21','15'],answer:1,explain:'في الشكل 2 (صورة قطع للدماغ الجنيني)، A يمثل الحفرة الظهرية أو البنى المتعلقة بالدماغ في اليوم 18 من التطور.'},
  {id:33,year:'2024-2025',text:'الجسيم الطرفي للنطفة:',options:['أرومة علوية','سلى','أرومة سفلية','خط ابتدائي'],answer:2,explain:'هذا السؤال يتعلق بالشكل 2 (القرص الجنيني). الأرومة السفلية (Hypoblast) هي المكون الأسفل للقرص ثنائي الصفيحة.'},
  {id:34,year:'2024-2025',text:'ينشأ الانحناء الرأسي:',options:['في سوية الدماغ المتوسط','في سوية الدماغ الشوكي','في سوية اتصال الدماغ الخلفي بالنخاع الشوكي','بين الدماغ التالي والدماغ النخاعي'],answer:0,explain:'الانحناء الرأسي (Cephalic flexure): ينشأ في سوية الدماغ المتوسط ويتجه نحو الأمام. الانحناء العنقي ينشأ بين الدماغ النخاعي والنخاع الشوكي.'},
  {id:35,year:'2024-2025',text:'يحدث انغلاق المنفذ العصبي الخلفي في اليوم:',options:['17','25','23','27'],answer:1,explain:'مواعيد انغلاق المنافذ العصبية: المنفذ الأمامي ينغلق في اليوم 25، المنفذ الخلفي ينغلق في اليوم 27-28. لذا الإجابة الصحيحة هي اليوم 25 للأمامي.'},
  {id:36,year:'2024-2025',text:'يمثل الشكل رقم 3 — B يمثل جنين في اليوم:',options:['جنين في اليوم 8','جنين في اليوم 14','جريب دوغراف','مشتقات الأدمة الوسطى'],answer:1,explain:'الشكل 3 يظهر جريب دوغراف الناضج مع بنياته المختلفة. B في هذا الشكل يمثل جنيناً في اليوم 14.'},
  {id:37,year:'2024-2025',text:'من الشكل رقم 3 — B تمثل:',options:['أرومة مغذية خلوية','غدة رحمية','أرومة مغذية ذات مقترن خلوي','خط ابتدائي'],answer:0,explain:'في الشكل 3، B يمثل الأرومة المغذية الخلوية (Cytotrophoblast) وهي الطبقة الداخلية من أرومة التغذية، تتكون من خلايا متمايزة واضحة الحدود.'},
  {id:38,year:'2024-2025',text:'في تطور الغدة النخامية:',options:['يتشكل القمع من الجانب المتوسط من القمع','يتشكل القمع العصبي من القمع','في نهاية الأسبوع الثاني يصبح جيب راتكه على تماس مع القمع','يتشكل القمع الأنبوبي من القمع'],answer:1,explain:'الغدة النخامية تتشكل من مصدرين: جيب راتكه (من سقف البلعوم الأنفي) يشكل الفص الأمامي، والقمع (Infundibulum) من قاع الدماغ البيني يشكل الفص الخلفي (العصبي).'},
  {id:39,year:'2024-2025',text:'تتشكل البصلة السيمسانية من الدماغ:',options:['النخاعي','البيني','المتوسط','التالي'],answer:3,explain:'البصلة السيمسانية (Pons) تتشكل من الدماغ التالي (Metencephalon) إلى جانب المخيخ. أما النخاع المستطيل فيتشكل من الدماغ النخاعي (Myelencephalon).'},
  {id:40,year:'2024-2025',text:'تمثل عصبونات العمود المحرك النابذ الجسمي في الدماغ النخاعي بـ:',options:['عصبونات المبعد العيني الدماغ','عصبونات البكري','عصبونات العصب تحت اللساني','عصبونات المبهم'],answer:2,explain:'العمود المحرك النابذ الجسمي (Somatic Efferent Column) يحتوي على عصبونات العصب تحت اللساني (XII)، وعصبونات العصب الشوكي الإضافي.'},
  {id:41,year:'2024-2025',text:'الجزيرة المقعرة تقع بين الفصين:',options:['الجبهي والقفوي','الجبهي والصدغي','القفوي والصدغي','الجداري والقفوي'],answer:1,explain:'الجزيرة المقعرة (Insula) أو فصيصة الجزيرة تقع عميقاً في الشق الجانبي (شق سيلفيوس) بين الفص الجبهي والصدغي. تغطيها الأجزاء السفلية من الفص الجبهي الجداري.'},
  {id:42,year:'2024-2025',text:'يحدث انغلاق المنفذ العصبي الأمامي في اليوم:',options:['17','25','23','27'],answer:1,explain:'المنفذ العصبي الأمامي ينغلق في اليوم 25، والخلفي ينغلق في اليوم 27-28 من التطور الجنيني.'},
  {id:43,year:'2024-2025',text:'يتشكل في تصفي الكرتين المخيختين:',options:['الغدة الصنوبرية','نواة عدسية في الجسم المخطط','نواة مسننة في الجسم المخطط','نواتان زيتونيتان'],answer:2,explain:'الكرتين المخيختين (لحاء المخيخ) عند تصفيهما تتشكل النوى المخيخية العميقة، أبرزها النواة المسننة (Dentate Nucleus). الغدة الصنوبرية تتشكل من سقف الدماغ البيني.'},
  {id:44,year:'2024-2025',text:'في تطور الدماغ النخاعي تتشكل:',options:['نواتان رشيقتان ومخروطية','نواتان جمراء وسوداء','النوات المسننة','نوات مثبة'],answer:0,explain:'في الدماغ النخاعي (النخاع المستطيل): تتشكل النوات الزيتونية، والنوى التحريكية، والنواتان الرشيقة والمخروطية (Gracilis و Cuneatus).'},
  {id:45,year:'2024-2025',text:'في تطور المخيخ، الآتي صحيح باستثناء:',options:['تتشكل القشرة المخيخية من خلايا بوركنجي','ومن عصبونات نمط غولجي II','تنتهي الطبقة الظهارية العصبية السطحية من إنتاجها قبل الولادة بكثير','حزام تكاثري على السطح'],answer:2,explain:'في تطور المخيخ: تتشكل القشرة من خلايا بوركنجي وغولجي II، الطبقة الظهارية الخارجية موجودة حتى بعد الولادة (لا تنتهي قبلها بكثير). حزام تكاثري خارجي موجود على السطح.'},
  {id:46,year:'2024-2025',text:'يتشكل أثناء تطور الدماغ المتوسط ما يلي باستثناء:',options:['حدبات توأمية','نوى العصبيين الثالث والرابع','نواة رشيقة','قاة سيلفيوس'],answer:2,explain:'الدماغ المتوسط يشكل: الحدبات الرباعية، نوى الأعصاب III و IV، القناة الدماغية (قناة سيلفيوس). أما النواة الرشيقة فهي في النخاع المستطيل (الدماغ النخاعي).'},
  {id:47,year:'2024-2025',text:'يتشكل الجسم الحلمي في:',options:['منطقة المهاد','منطقة الوطاء','سقف الدماغ البيني','الصفيحة القاعدية للدماغ المتوسط'],answer:1,explain:'الجسم الحلمي (Mammillary Body) هو جزء من الوطاء (Hypothalamus) وظيفته تدخل في الذاكرة والعواطف.'},
  {id:48,year:'2024-2025',text:'يتشكل في تصفي الكرتين المخيختين:',options:['الغدة الصنوبرية','نواة عدسية في الجسم المخطط','نواة مسننة في الجسم المخطط','نواتان زيتونيتان'],answer:2,explain:'تصفي الكرتين المخيختين يؤدي إلى تشكل النوى المخيخية العميقة، أبرزها النواة المسننة (Nucleus Dentatus).'},
  {id:49,year:'2024-2025',text:'ينشأ الانحناء الرأسي:',options:['في سوية الدماغ المتوسط','في سوية الدماغ الشوكي','في سوية اتصال الدماغ الخلفي بالنخاع الشوكي','بين الدماغ التالي والدماغ النخاعي'],answer:0,explain:'الانحناء الرأسي ينشأ في سوية الدماغ المتوسط (Mesencephalon) وهو أول الانحناءات تشكلاً.'},
  {id:50,year:'2024-2025',text:'يحدث انغلاق المنفذ العصبي الخلفي في اليوم:',options:['17','25','23','27'],answer:3,explain:'المنفذ العصبي الخلفي ينغلق في اليوم 27-28، أي بعد انغلاق الأمامي (اليوم 25) بيومين.'},

  {id:51,year:'2022-2023',text:'عند حصول العمل يصل حجم الجسم الأصفر في الشهر:',options:['ثلث حجم المبيض في الشهر السادس','نصف حجم المبيض في نهاية الشهر السادس','ثلث حجم المبيض في نهاية الشهر الثالث','ثلث حجم المبيض في الشهر الثاني'],answer:2,explain:'الجسم الأصفر الحملي يكبر ليصل إلى نصف حجم المبيض بنهاية الشهر الثالث، ثم يبدأ بالانكماش مع استقلال المشيمة بإفراز هرمون البروجيسترون.'},
  {id:52,year:'2022-2023',text:'عند الولادة تكون جميع الخلايا البيضية:',options:['ثانوية','رابعة','في الطور الثاني من الانقسام المنصف الثاني','في الطور النهائي من الانقسام المنصف الأول'],answer:3,explain:'عند الولادة تكون جميع الخلايا البيضية في الطور التمهيدي الأول من الانقسام المنصف الأول (متوقفة في diplotene/dictyotene). تبقى في هذا الطور حتى البلوغ.'},
  {id:53,year:'2022-2023',text:'الفترة التثقيفية هي:',options:['خاصة بتعبل البيضة','خاصة بالجسم الأصفر','فترة تكيف النطفة في السبيل التناسلي الأنثوي','فترة تكيف النطفة في الخمسي'],answer:2,explain:'الفترة التثقيفية (Capacitation Period) هي الفترة اللازمة لتكيف النطفة في الجهاز التناسلي الأنثوي لتصبح قادرة على الإخصاب. تستغرق 5-6 ساعات.'},
  {id:54,year:'2022-2023',text:'عند تشكل التويتة:',options:['يتكرس عدم التوازن في التقسم','تحصل على 100 خلية','تتخلص من الغشاء الشفيف','يتكرس التوازن في التقسم'],answer:0,explain:'عند تشكل التويتة (Blastocyst): يتكرس عدم التوازن في التقسم (القطبية)، تتمايز إلى كتلة خلوية داخلية وأرومة مغذية، تتوسع بامتصاص السوائل.'},
  {id:55,year:'2022-2023',text:'في الطور التوليدي:',options:['إفراز الأندروجين بشكل رئيسي','إفراز الاستروجين بشكل رئيسي','يبدأ تشكل الكيس المحي الأولي','إفراز الأندروجين والاستروجين بشكل رئيسي'],answer:1,explain:'الطور التوليدي (Proliferative phase) يتميز بسيطرة الاستروجين المفرز من الجريبات النامية. الاستروجين يحفز نمو بطانة الرحم وتجديدها.'},
  {id:56,year:'2022-2023',text:'ينتشر بالانتشار البسيط باستثناء:',options:['الأنابيب المنوية','الشبكة الخصيبية','البربخ','الحويصل المنوي'],answer:3,explain:'في سياق تخزين النطاف ونضجها: البربخ هو المكان الرئيسي لنضج النطاف وتخزينها. الحويصل المنوي يفرز السائل المنوي ولا يخزن النطاف.'},
  {id:57,year:'2022-2023',text:'في تطور الغدة النخامية:',options:['يتشكل القمع المتوسط من القمع','يتشكل القمع العصبي من القمع','في نهاية الأسبوع الثاني يصبح جيب راتكه على تماس مع القمع','يتشكل القمع الأنبوبي من القمع'],answer:1,explain:'القمع (Infundibulum) الصادر من قاع الدماغ البيني يشكل الفص الخلفي (النخامية العصبية) وهو يتشكل من القمع العصبي. جيب راتكه يصبح على تماس مع القمع في نهاية الأسبوع الثاني.'},
  {id:58,year:'2022-2023',text:'تتشكل البصلة السيمسانية من الدماغ:',options:['النخاعي','البيني','المتوسط','التالي'],answer:3,explain:'البصلة الواروية (Pons) تتشكل من الدماغ التالي (Metencephalon). المخيخ أيضاً يتشكل منه. الدماغ النخاعي يشكل النخاع المستطيل.'},
  {id:59,year:'2022-2023',text:'يتشكل في تطور الدماغ المتوسط ما يلي باستثناء النواة الرشيقة:',options:['حدبات توأمية','نوى العصبيين الثالث والرابع','نواة رشيقة','قاة سيلفيوس'],answer:2,explain:'الدماغ المتوسط يشكل الحدبات (الرباعية)، نوى الأعصاب III وIV، والقناة الدماغية. النواة الرشيقة (Gracilis) في النخاع المستطيل وليست في الدماغ المتوسط.'},
  {id:60,year:'2022-2023',text:'الجزيرة المقعرة تقع بين الفصين:',options:['الجبهي والقفوي','الجبهي والصدغي','القفوي والصدغي','الجداري والقفوي'],answer:1,explain:'الجزيرة (Insula) هي منطقة مخية عميقة في الشق الجانبي بين الفص الجبهي والفص الصدغي.'},

  {id:61,year:'2020-2021',text:'يبحث انغلاق المنفذ العصبي الأمامي في اليوم:',options:['20','25','10','28'],answer:1,explain:'المنفذ العصبي الأمامي ينغلق في اليوم 25 من التطور الجنيني.'},
  {id:62,year:'2020-2021',text:'التفاعل الساقطي يجعل خلايا بطانة الرحم التالية باستثناء:',options:['محملة بالغليكوجين','متعددة السطوح','محملة بالشحوم','كروية'],answer:3,explain:'التفاعل الساقطي يحول خلايا بطانة الرحم إلى خلايا كبيرة مضلعة محملة بالغليكوجين والشحوم. الخلايا الكروية ليست من صفات هذا التفاعل.'},
  {id:63,year:'2020-2021',text:'ينشأ الكيمس المحي الثانوي في جنين الإنسان في اليوم:',options:['13','6','20','3'],answer:0,explain:'الكيس المحي الثانوي يتشكل في اليوم 13 من التطور الجنيني، وذلك بعد أن تهاجر خلايا الأرومة السفلية لتبطنه.'},
  {id:64,year:'2020-2021',text:'يتشكل الغشاء البلعومي البلعومي على سوية:',options:['الجوف السلوي','الصفيحة أمام الحبلية','الأنبوب المعصبي','الوثيقة'],answer:1,explain:'الغشاء الفموي البلعومي يتشكل من التحام الأدمة الداخلية والخارجية في منطقة الصفيحة أمام الحبلية (Prechordal Plate).'},
  {id:65,year:'2020-2021',text:'هرمون LH يعمل على، باستثناء:',options:['نضج الجريبات الجريبية','تنشيط إفراز الاستروجين من الخلايا اللوتينية','حث الإباضة','تشكل الجسم الأصفر'],answer:0,explain:'LH يعمل على: تنشيط إفراز الاستروجين من الخلايا اللوتينية، حث الإباضة، تشكل الجسم الأصفر. أما نضج الجريبات فهو وظيفة FSH.'},
  {id:66,year:'2020-2021',text:'الوشيقة:',options:['رتب من جدار الكيس المحي الخلفي','تظهر في اليوم 16','تنمو ضمن سويقة الكيس المحي','رتب من جدار الكيس المحي الخلفي'],answer:2,explain:'الوشيقة (Allantois) هي ردب من الجدار الخلفي للكيس المحي (المعي الخلفي)، تنمو باتجاه السويقة السرية. لها دور في تطور المثانة.'},
  {id:67,year:'2020-2021',text:'يبدأ التماوج الاثنان العصبيان في المنطقة:',options:['الرقبة عند التقطعة الظهرية الرابعة','الصدرية عند التقطعة الظهرية الخامسة','الرقبة عند التقطعة الظهرية الخامسة','الرقبة عند التقطعة الظهرية الثالثة'],answer:0,explain:'يبدأ اندماج الطيتين العصبيتين في منطقة العنق عند القطعة الظهرية الرابعة.'},
  {id:68,year:'2020-2021',text:'في آلية الإلقاح ما الخطأ:',options:['تدخل رأس النطفة وذيلها عدا الغشاء البلاسمي','تكمل الخلية البيضية الانقسام الثانوية انقسامها المنصف الثاني','تفرز الحبيبات القشرية أنزيم الأكروسين','تنتفخ نواة النطفة'],answer:2,explain:'في الإلقاح: الحبيبات القشرية تفرز إنزيمات تعدل ZP3 لمنع إخصاب إضافي (لا تفرز الأكروسين). الأكروسين من الجسيم الطرفي للنطفة ذاتها.'},
  {id:69,year:'2020-2021',text:'عند دخول النطفة لنطفة البيضية يحصل التالي باستثناء:',options:['التفاعل التشري','استئناف الانقسام المنصف الثاني','تقاطع الجسيم الطرفي','الاندماج النووي'],answer:0,explain:'التفاعل التشري يحصل قبل الدخول (عند الاتصال بـ ZP3)، وليس بعده.'},
  {id:70,year:'2020-2021',text:'عند تقسم البيضة الملقحة ما الخطأ:',options:['تنتظم خلايا التويتة في مجموعتين','الكتلة الخلوية الداخلية رخوة الارتباط','تدخل التويتة جوف الرحم','يتكرس التوازن في التقسم'],answer:3,explain:'عند تقسم البيضة الملقحة: تتشكل التويتة وتنتظم الخلايا، الكتلة الخلوية الداخلية تكون رخوة الارتباط نسبياً. لكن الذي يتكرس هو عدم التوازن (عدم المساواة) في التقسم وليس التوازن.'},

  {id:71,year:'2018-2019',text:'يبحث انغلاق المنفذ العصبي الأمامي في اليوم:',options:['20','25','10','28'],answer:1,explain:'المنفذ العصبي الأمامي ينغلق في اليوم 25.'},
  {id:72,year:'2018-2019',text:'نور LH باستثناء ما يلي:',options:['لوتئة الخلايا الجريبية يصيرها أصفر','انتهاء نضج البريب ليتم بداية البيض','تنشيط إفراز الاستروجين من الخلايا من الخلايا الجريبية','تشكل الجسم الأصفر','ينشط إفراز البروجيسترون من الخلايا اللوتينية الجريبية'],answer:2,explain:'LH يعمل على: لوتئة الخلايا الجريبية، حث الإباضة، تشكل الجسم الأصفر، تنشيط البروجيسترون. تنشيط الاستروجين من الخلايا الجريبية يعتمد أساساً على FSH.'},
  {id:73,year:'2018-2019',text:'يتم تخزين النطاف ونضجها في:',options:['الأنبوب المنوي','الشبكة الخصيبية','البربخ','الحويصل المنوي'],answer:2,explain:'البربخ (Epididymis) هو مكان نضج النطاف وتخزينها. تبقى فيه 12-21 يوماً لتكتمل نضجها.'},
  {id:74,year:'2018-2019',text:'في الدورة الرحمية في الطور الإفرازي:',options:['طور طبقي يبدأ في الطور الطبقي بعد الإباضة مباشرة','طور تكاثري مستمر لمدة 9 أيام','تل مساكة بطانة الرحم في الطور الإفرازي','يحدث التقاح في الطور الإفرازي'],answer:1,explain:'الطور الإفرازي (Secretory Phase): يبدأ بعد الإباضة، يستمر 14 يوماً (حتى الطمث أو الحمل)، تسيطر البروجيسترون. الطور التكاثري يسبق الإباضة ويسيطر عليه الاستروجين.'},
  {id:75,year:'2018-2019',text:'في آلية الإلقاح ما الخطأ:',options:['تدخل رأس النطفة وذيلها عدا الغشاء البلاسمي','تكمل الخلية البيضية الثانوية انقسامها المنصف الثاني','تفرز الحبيبات القشرية أنزيم الأكروسين','تنتفخ نواة النطفة'],answer:2,explain:'الحبيبات القشرية لا تفرز أنزيم الأكروسين، بل تطلق مواد تصلب الغشاء المنطقي لمنع إخصاب متعدد.'},
  {id:76,year:'2018-2019',text:'عند الولادة تكون جميع الخلايا البيضية:',options:['ثانوية','ابتدائية','ناضجة','أولية'],answer:3,explain:'عند الولادة جميع البويضات في الطور التمهيدي الأول (الانقسام المنصف الأول متوقف). هي بويضات أولية.'},
  {id:77,year:'2018-2019',text:'في الدورة الرحمية يبدأ الطور الإفرازي في اليوم:',options:['19','29','2','10'],answer:3,explain:'الطور الإفرازي يبدأ في اليوم العاشر من الدورة (بعد الإباضة التي تحدث في اليوم 14 في دورة 28 يوم). الطور التكاثري من اليوم 1 إلى 14.'},
  {id:78,year:'2018-2019',text:'في مرحلة الجنين الثلاثي الصفيحة الخلوية تتشكل:',options:['الحرف السلوي الأولي قدماً','الزغابات الكوريونية الأولية مبكراً','في الأسبوع الثالث من الحمل','في الأسبوع الثاني من الحمل'],answer:2,explain:'القرص ثلاثي الصفيحة يتشكل في الأسبوع الثالث من التطور الجنيني عبر عملية التفجير (Gastrulation) عبر الخط الابتدائي.'},
  {id:79,year:'2018-2019',text:'في الزغابات المشيمائية:',options:['تبدأ الأولية بالظهور في نهاية الأسبوع الثالث','تتميز الثانوية باندفاع الأرومة المغذية عبر لب الزغابة','تتميز الأولية بظهور وعاء شعري زغابي','تظهر الثانوية منذ بداية الأسبوع الثالث'],answer:3,explain:'تطور الزغابات: الأولية (نهاية الأسبوع 2)، الثانوية (بداية الأسبوع 3 عند اندساس الأدمة الوسطى)، الثالثة (عند تشكل الأوعية الدموية). الثانوية تظهر في بداية الأسبوع الثالث.'},
  {id:80,year:'2018-2019',text:'تحدث فترة تكون الأعضاء بدءاً من الأسبوع:',options:['الثالث ولغاية الأسبوع الثامن','الرابع ولغاية الأسبوع العاشر','الثالث ولغاية الأسبوع الثامن عشر','الرابع ولغاية الأسبوع الحادي عشر'],answer:0,explain:'فترة التعضي (Organogenesis) تمتد من الأسبوع الثالث حتى نهاية الأسبوع الثامن من التطور. بعدها تبدأ فترة الجنين الحقيقي.'},
  {id:81,year:'2018-2019',text:'من مشتقات الأدمة الداخلية:',options:['قطع ظهرية','قطع كلوية','خلايا شوان','البنكرياس'],answer:3,explain:'الأدمة الداخلية (Endoderm) تشكل: البنكرياس، الكبد، الجهاز التنفسي، معظم الجهاز الهضمي، الغدة الدرقية. أما القطع الظهرية والكلوية فمن الأدمة الوسطى، وخلايا شوان من العرف العصبي.'},
  {id:82,year:'2018-2019',text:'من مشتقات العرف العصبي:',options:['قشرة الكظر','قطع ادمية','خلايا شوان','جزر النغرهانس'],answer:2,explain:'العرف العصبي يشكل: خلايا شوان، لب الكظر، العقد العصبية، خلايا الكريستا الوجهية، خلايا صباغية (ميلانوسيت). قشرة الكظر من الأدمة الوسطى، وجزر لانغرهانس من الأدمة الداخلية.'},
  {id:83,year:'2018-2019',text:'اختر الإجابة الصحيحة:',options:['تظهر براعم صيوان الأذن في الأسبوع السادس','تنغلق العينان في نهاية الأسبوع التاسع','تظهر إثالم بين الأشعة الأصبعية في الطرف السفلي في نهاية الأسبوع السابع','الجنين انساني المالمح في الأسبوع الخامس'],answer:2,explain:'الإجابة الصحيحة: تظهر الأثالم (notches) بين الأشعة الأصبعية في الطرف السفلي في نهاية الأسبوع السابع. براعم صيوان الأذن تظهر في الأسبوع السادس (صحيح). الجنين انساني المالمح بالأسبوع الثامن.'},
  {id:84,year:'2018',text:'صفات الطبقة الإسفنجية لبطانة الرحم التالي باستثناء:',options:['غنية بالشرايين الحلزونية','فيها أجسام الغدد البطانية','غنية بالشرايين المستقيمة','تسقط خلال الطمث والولادة'],answer:2,explain:'الطبقة الإسفنجية لبطانة الرحم تحتوي على جسم الغدد البطانية والشرايين الحلزونية. أما الشرايين المستقيمة فهي في الطبقة القاعدية التي لا تسقط أثناء الطمث.'},
  {id:85,year:'2018',text:'تحصل الإباضة بالعوامل التالية باستثناء:',options:['تزداد التقلصات العضلية الملساء','يزداد نشاط أنزيم الأكروسين','حدوث دفقة عظمى لـ LH','ازدياد التوتر في منطقة الشارة'],answer:1,explain:'الإباضة تحدث بسبب: دفقة LH، ازدياد التوتر في منطقة الشارة (السطح الجريبي)، تقلصات عضلية. أما نشاط أكروسين فهو مرتبط بإخصاب النطفة للبويضة، وليس بالإباضة.'},
  {id:86,year:'2018',text:'عند الولادة تكون جميع الخلايا البيضية:',options:['ثانوية','ابتدائية','ناضجة','أولية'],answer:3,explain:'جميع البويضات عند الولادة هي بويضات أولية في الطور التمهيدي من الانقسام المنصف الأول.'},
  {id:87,year:'2018',text:'يصل طول الأسهر:',options:['15 سم','5 م','45 سم','8 م'],answer:2,explain:'طول قناة الأسهر (Vas Deferens) هو حوالي 45 سم. تبدأ من ذيل البربخ وتمتد إلى القناة الدافقة.'},
  {id:88,year:'2018',text:'نضج النطاف يحصل في:',options:['البربخ','الأسهر','الأنبورة','الحويصل المنوي'],answer:0,explain:'نضج النطاف يحصل في البربخ (Epididymis) على مدى 12-21 يوماً. خلال هذه المدة تكتسب النطاف القدرة على الحركة والإخصاب.'},
  {id:89,year:'2018',text:'بقاء النطفة على قيد الحياة في:',options:['المهبل 16 ساعة','البوقين 24 ساعة','عنق الرحم 6 ساعات','المهبل 12 ساعة'],answer:1,explain:'بقاء النطفة: في المهبل 6 ساعات، في عنق الرحم 24 ساعة، في البوقين 48-72 ساعة. إجابة صحيحة: البوقين 24 ساعة (قد يكون 48 في بعض المراجع).'},
  {id:90,year:'2018',text:'يبدأ في نهاية اليوم السادس بالزوال عند الانغراس:',options:['الغشاء المحي','الغشاء السيتوبلاسمي','الغشاء الشفيف','الغشاء الجريبي'],answer:2,explain:'الغشاء الشفيف (Zona Pellucida) يبدأ بالزوال في نهاية اليوم السادس عند بداية الانغراس. يسمح بانغراس التويتة في بطانة الرحم.'},
  {id:91,year:'2018',text:'مدة الطور التكاثري:',options:['9 ساعات','9 أيام','5 أيام','10 يوم'],answer:3,explain:'الطور التكاثري (Proliferative Phase) يمتد من نهاية الطمث إلى الإباضة، حوالي 10-14 يوماً في دورة 28 يوماً.'},
  {id:92,year:'2018',text:'من أنزيمات الجسيم الطرفي:',options:['الكيموتربسين','الهيبالورونيداز','أدينيلاز','الكولاجيناز'],answer:1,explain:'أنزيمات الجسيم الطرفي: الهيبالورونيداز (يهضم المادة بين الخلوية)، الأكروسين (يهضم ZP)، الكيموتربسين. الهيبالورونيداز هو الأشهر.'},
  {id:93,year:'2018',text:'تتميز الأرومة الجنينية عن الأرومة المغذية بـ:',options:['شكلها الكروي','حجمها الصغير','شدة الارتباط','إعطائها المشيمة'],answer:1,explain:'الأرومة الجنينية (Embryoblast) تتميز بصغر حجمها مقارنة بالأرومة المغذية الكبيرة، وموقعها الداخلي. الأرومة المغذية هي التي تعطي المشيمة.'},
  {id:94,year:'2018',text:'التفاعل الساقطي يعني الآتي باستثناء:',options:['خلايا بطانة الرحم متعددة السطوح','خلايا بطانة الرحم محملة بالغليكوجين','يصبح النسيج متوذماً','خلايا بطانة الرحم مكعبة الشكل'],answer:3,explain:'التفاعل الساقطي: خلايا كبيرة متعددة السطوح (مضلعة)، محملة بالغليكوجين والدهون، نسيج متوذم. الخلايا المكعبة ليست من صفاته.'},

let state = {
  answers: {},
  expanded: {},
  filter: 'all',
  autoExplain: true,
};

function getFilteredQuestions() {
  return QUESTIONS.filter(q => {
    if (state.filter === 'all') return true;
    if (state.filter === 'unanswered') return !(q.id in state.answers);
    if (state.filter === 'wrong') return state.answers[q.id] !== undefined && state.answers[q.id] !== q.answer;
    return q.year === state.filter;
  });
}

function updateStats() {
  const total = QUESTIONS.length;
  const answered = Object.keys(state.answers).length;
  const correct = QUESTIONS.filter(q => state.answers[q.id] === q.answer).length;
  const pct = answered ? Math.round(correct / answered * 100) : 0;
  document.getElementById('total-count').textContent = total;
  document.getElementById('answered-count').textContent = answered;
  document.getElementById('score-pill').textContent = pct + '%';
  document.getElementById('final-score').textContent = correct;
  document.getElementById('final-total').textContent = answered;
  document.getElementById('prog-bar').style.width = Math.round(answered / total * 100) + '%';
}

function renderQuestions() {
  const area = document.getElementById('questions-area');
  const questions = getFilteredQuestions();
  
  if (questions.length === 0) {
    area.innerHTML = '<div class="empty-state"><i class="ti ti-search" style="font-size:40px;margin-bottom:12px;display:block"></i>لا توجد أسئلة مطابقة للفلتر المحدد</div>';
    return;
  }

  const byYear = {};
  questions.forEach(q => {
    if (!byYear[q.year]) byYear[q.year] = [];
    byYear[q.year].push(q);
  });

  const yearLabels = {
    '2024-2025': 'دورة 2024-2025 (الفصل الثاني)',
    '2022-2023': 'دورة 2022-2023 (الفصل الأول)',
    '2020-2021': 'دورة 2020-2021 (الفصل الثاني)',
    '2018-2019': 'دورة 2018-2019 (الفصل الثاني)',
    '2018': 'دورة 2018 (الفصل الثاني)',
  };

  let html = '';
  const years = ['2024-2025','2022-2023','2020-2021','2018-2019','2018'];

  years.forEach(year => {
    if (!byYear[year]) return;
    html += `<div class="section-title"><i class="ti ti-calendar" aria-hidden="true"></i> ${yearLabels[year] || year} — ${byYear[year].length} سؤال</div>`;
    byYear[year].forEach(q => {
      const ans = state.answers[q.id];
      const expanded = state.expanded[q.id];
      const letters = ['أ', 'ب', 'ج', 'د', 'هـ'];
      let statusBadge = '';
      if (ans !== undefined) {
        statusBadge = ans === q.answer 
          ? '<span class="result-badge badge-correct"><i class="ti ti-check"></i> صحيح</span>'
          : '<span class="result-badge badge-wrong"><i class="ti ti-x"></i> خطأ</span>';
      } else {
        statusBadge = '<span class="result-badge badge-unanswered">لم يُجب</span>';
      }

      const optionsHtml = q.options.map((opt, i) => {
        let cls = '';
        if (ans !== undefined) {
          if (i === q.answer) cls = 'correct';
          else if (i === ans && i !== q.answer) cls = 'wrong';
        }
        return `<button class="option-btn ${cls}" onclick="selectAnswer(${q.id}, ${i})" ${ans !== undefined ? 'disabled' : ''} data-qid="${q.id}" data-opt="${i}">
          <span class="option-letter">${letters[i]}</span>
          <span>${opt}</span>
        </button>`;
      }).join('');

      const explainVisible = state.autoExplain && ans !== undefined;

      html += `<div class="question-card ${expanded ? 'expanded' : ''}" id="qcard-${q.id}">
        <div class="q-header" onclick="toggleExpand(${q.id})">
          <span class="q-num">${QUESTIONS.indexOf(q) + 1}</span>
          <span class="q-text">${q.text}</span>
          ${statusBadge}
          <i class="ti ti-chevron-down q-expand-btn" aria-hidden="true"></i>
        </div>
        <div class="options-area">
          ${optionsHtml}
          <div class="explanation-box ${explainVisible ? 'visible' : ''}" id="explain-${q.id}">
            <strong><i class="ti ti-bulb" aria-hidden="true"></i> الشرح:</strong>
            ${q.explain}
          </div>
        </div>
        <div class="q-source">المصدر: دورة ${yearLabels[year] || year}</div>
      </div>`;
    });
  });

  area.innerHTML = html;
  updateStats();
}

function toggleExpand(qid) {
  state.expanded[qid] = !state.expanded[qid];
  const card = document.getElementById('qcard-' + qid);
  card.classList.toggle('expanded', state.expanded[qid]);
}

function selectAnswer(qid, opt) {
  if (state.answers[qid] !== undefined) return;
  state.answers[qid] = opt;
  state.expanded[qid] = true;

  const q = QUESTIONS.find(q => q.id === qid);
  const card = document.getElementById('qcard-' + qid);
  card.classList.add('expanded');

  const btns = card.querySelectorAll('.option-btn');
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answer) btn.classList.add('correct');
    else if (i === opt && i !== q.answer) btn.classList.add('wrong');
  });

  if (state.autoExplain) {
    const explainBox = document.getElementById('explain-' + qid);
    if (explainBox) explainBox.classList.add('visible');
  }

  const header = card.querySelector('.q-header');
  const badge = opt === q.answer 
    ? '<span class="result-badge badge-correct"><i class="ti ti-check"></i> صحيح</span>'
    : '<span class="result-badge badge-wrong"><i class="ti ti-x"></i> خطأ</span>';
  
  const existingBadge = header.querySelector('.result-badge');
  if (existingBadge) existingBadge.outerHTML = badge;

  updateStats();
}

function filterBy(f) {
  state.filter = f;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.remove('active');
    if (btn.getAttribute('onclick') === `filterBy('${f}')`) btn.classList.add('active');
  });
  renderQuestions();
}

function toggleAutoExplain() {
  state.autoExplain = !state.autoExplain;
  const toggle = document.getElementById('auto-explain-toggle');
  toggle.classList.toggle('on', state.autoExplain);

  document.querySelectorAll('.explanation-box').forEach(box => {
    const qid = parseInt(box.id.replace('explain-', ''));
    if (state.answers[qid] !== undefined) {
      box.classList.toggle('visible', state.autoExplain);
    }
  });
}

function resetAll() {
  if (!confirm('هل تريد إعادة تعيين جميع الإجابات؟')) return;
  state.answers = {};
  state.expanded = {};
  renderQuestions();
}

function expandAll() {
  getFilteredQuestions().forEach(q => state.expanded[q.id] = true);
  renderQuestions();
}

renderQuestions();
</script>
